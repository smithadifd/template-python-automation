# Family 2 (Python automation) CI baseline — standards/ci.md §Family 2.
# Runs from a fresh clone with NO secrets: install -> lint -> format-check -> test.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          # Pin the interpreter from the repo's .python-version.
          python-version-file: .python-version

      - name: Install (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest
